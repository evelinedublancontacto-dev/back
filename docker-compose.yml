# Postgres para desarrollo local. En producción la base la administra Railway.
services:
  postgres:
    image: postgres:16-alpine
    container_name: eveline-postgres
    environment:
      POSTGRES_DB: eveline
      POSTGRES_USER: eveline
      POSTGRES_PASSWORD: eveline
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eveline -d eveline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
